name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig fmt
        run: zig fmt --check build.zig src
      - name: build
        run: zig build
      - name: test
        run: zig build test
